[package]
name = "agent-task"
version = "0.1.0"
edition = "2021"
description = "AI エージェント向け SQLite タスク管理 CLI"
license = "MIT"

[[bin]]
name = "agent-task"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.1"
dirs = "5"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
